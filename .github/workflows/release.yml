name: Build and release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select the installed Apple tools
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
      - name: Select the package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Release tags must use vX.Y.Z.' >&2
              exit 1
            fi
            VERSION="${REF_NAME#v}"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Run regression tests
        run: ./test.sh
      - name: Build and package
        run: ./release.sh "$RELEASE_VERSION"
      - name: Check whitespace
        run: git diff --check
      - name: Save release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macOS-arm64
          path: build/release/${{ env.RELEASE_VERSION }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macOS-arm64
          path: release
      - name: Verify package checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --title "Foliobruma Scanner $RELEASE_TAG" \
            --notes-file release/READ-ME-FIRST.txt --generate-notes
