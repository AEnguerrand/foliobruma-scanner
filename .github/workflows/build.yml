name: Build

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-core:
    name: Shared core (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0.3
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test without Apple frameworks
        run: swift run ScannerCoreChecks

  pi-diagnostics:
    name: Pi diagnostics (Linux host checks)
    runs-on: ubuntu-24.04
    container: swift:6.0.3
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install diagnostic build libraries
        run: apt-get update && apt-get install -y build-essential python3 openssl pkg-config libusb-1.0-0-dev libqrencode-dev
      - name: Build real adapters and run host checks
        run: |
          ./RaspberryPi/build-diagnostics.sh
          ./RaspberryPi/test-diagnostics.sh
          mkdir -p RaspberryPi/results
          RaspberryPi/build/qr-matrix > RaspberryPi/results/ci-matrix.txt
          RaspberryPi/.build/debug/DiagnosticLabel RaspberryPi/results/ci-matrix.txt RaspberryPi/results/ci-label.raster

  build:
    name: Test and build (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select the installed Apple tools
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
      - name: Run regression tests
        run: ./test.sh
      - name: Build the app
        run: ./build.sh
      - name: Check whitespace
        run: git diff --check
