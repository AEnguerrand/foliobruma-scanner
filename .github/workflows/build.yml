name: Build

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select the installed Apple tools
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
      - name: Run regression tests
        run: ./test.sh
      - name: Build the app
        run: ./build.sh
      - name: Check whitespace
        run: git diff --check
